name: TDS GA7 Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for the whole workflow: read the code, nothing else.
permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate policy tests
    runs-on: ubuntu-latest
    # The whole matrix must finish so a single red cell cannot hide the rest.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: "TDS identity: 23f1002944@ds.study.iitm.ac.in"
        run: echo "TDS GA7 — 23f1002944@ds.study.iitm.ac.in"

      # Third-party and first-party actions alike are pinned to a full commit SHA.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit tests for the release-gate policy
        run: node --test "test/**/*.test.js"

      - name: End-to-end probe of POST /release-gate
        run: node scripts/e2e.mjs
